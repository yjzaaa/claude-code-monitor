<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Agent Hub</title>
<link rel="stylesheet" href="/static/xterm.css">
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--green:#3fb950;--yellow:#d29922;--red:#f85149;--blue:#58a6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

.header{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:40px}
.header h1{font-size:15px;font-weight:600}
.header-right{display:flex;align-items:center;gap:6px}
.status-dot{width:7px;height:7px;border-radius:50%}
.dot-green{background:var(--green);box-shadow:0 0 4px var(--green)}
.dot-red{background:var(--red)}
.dot-yellow{background:var(--yellow);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;user-select:none}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

.tab-content{display:none;flex:1;overflow:hidden}
.tab-content.active{display:flex;flex-direction:column}

/* Agent cards */
.agent-bar{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.agent-card{flex-shrink:0;width:80px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;user-select:none;transition:all 0.15s}
.agent-card:active{transform:scale(0.95)}
.agent-card.active{border-color:var(--blue);box-shadow:0 0 8px rgba(88,166,255,0.3)}
.agent-card.running{border-color:var(--green)}
.agent-icon{font-size:22px;margin-bottom:2px}
.agent-name{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-status{font-size:9px;margin-top:2px}
.agent-status-dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:2px}
.dot-idle{background:var(--text2)}
.dot-run{background:var(--green)}
.dot-stop{background:var(--red)}

/* Terminal area */
.terminal-area{flex:1;display:flex;overflow:hidden;position:relative}
.terminal-pane{flex:1;display:none;position:relative;overflow:hidden;background:#0d1117}
.terminal-pane.visible{display:flex;flex-direction:column}
.terminal-pane .xterm{flex:1}
.terminal-pane .pane-header{padding:3px 8px;font-size:10px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.terminal-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;text-align:center;padding:20px}

/* Split modes */
.terminal-area.split-2 .terminal-pane.visible{flex:1;max-height:50%}
.terminal-area.split-4 .terminal-pane.visible{flex:1;max-height:50%;max-width:50%}
.terminal-area.split-2{flex-direction:column}
.terminal-area.split-4{flex-direction:row;flex-wrap:wrap}

/* Mobile bar */
.mobile-bar{display:flex;gap:3px;padding:3px 6px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;align-items:center;flex-wrap:wrap;justify-content:center}
.mobile-bar input{flex:1;min-width:60px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:6px 8px;color:var(--text);font-size:16px;outline:none}
.mobile-bar input:focus{border-color:var(--blue)}
.mobile-bar button{background:var(--blue);border:none;color:#fff;border-radius:5px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.mobile-bar button:active{opacity:0.8}
.qk-btn{background:var(--bg)!important;border:1px solid var(--border)!important;color:var(--text)!important;padding:6px 8px!important;min-width:32px}
.voice-active{background:rgba(248,81,73,0.2)!important;border-color:var(--red)!important;color:var(--red)!important}

/* Dashboard */
.dashboard-scroll{flex:1;overflow-y:auto;padding:10px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px}
.card-label{font-size:10px;color:var(--text2);margin-bottom:3px}
.card-value{font-size:18px;font-weight:700}
.card.full{grid-column:1/-1}
.event-item{padding:4px 8px;border-bottom:1px solid var(--border);font-size:11px;display:flex;gap:6px;align-items:center}
.event-time{color:var(--text2);font-family:monospace;font-size:10px;white-space:nowrap}
.event-type{padding:1px 4px;border-radius:3px;font-size:9px;font-weight:600;white-space:nowrap}
.ev-tool{background:rgba(88,166,255,.15);color:var(--blue)}
.ev-stop{background:rgba(248,81,73,.15);color:var(--red)}
.ev-start{background:rgba(63,185,80,.15);color:var(--green)}
</style>
</head>
<body>
<div class="header">
  <h1>Agent Hub</h1>
  <div class="header-right">
    <span id="connDot" class="status-dot dot-yellow"></span>
    <span id="connBadge" style="font-size:11px;color:var(--text2)">连接中</span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="terminal" onclick="switchTab('terminal')">终端</div>
  <div class="tab" data-tab="dashboard" onclick="switchTab('dashboard')">监控</div>
</div>

<div class="agent-bar" id="agentBar"></div>

<input id="hiddenInput" type="text" autocorrect="off" autocapitalize="off" spellcheck="false"
  style="position:fixed;top:-100px;left:0;width:1px;height:1px;opacity:0.01;font-size:16px;z-index:-1">

<div id="tab-terminal" class="tab-content active">
  <div class="terminal-area" id="terminalArea">
    <div class="terminal-placeholder" id="noAgentHint">未检测到 Agent，请先安装 CLI 工具</div>
  </div>
</div>

<div id="tab-dashboard" class="tab-content">
  <div class="dashboard-scroll">
    <div class="cards">
      <div class="card"><div class="card-label">状态</div><div id="dStatus" class="card-value" style="color:var(--text2)">--</div></div>
      <div class="card"><div class="card-label">运行时长</div><div id="dUptime" class="card-value">0:00</div></div>
      <div class="card full"><div class="card-label">事件日志</div><div id="eventList" style="max-height:50vh;overflow-y:auto"></div></div>
    </div>
  </div>
</div>

<div id="mobileBar" class="mobile-bar">
  <button class="qk-btn" onclick="sendKey('Escape')">Esc</button>
  <button class="qk-btn" onclick="sendKey('C-c')">C-C</button>
  <button class="qk-btn" onclick="sendKey('Tab')">Tab</button>
  <button class="qk-btn" onclick="sendKey('Up')">Up</button>
  <button class="qk-btn" onclick="sendKey('Down')">Dn</button>
  <button class="qk-btn" id="splitBtn" onclick="cycleSplit()">分屏</button>
  <button class="qk-btn" id="voiceBtn" onclick="toggleVoice()">MIC</button>
  <input id="inputText" type="text" placeholder="输入指令或语音..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <button onclick="sendText()">发送</button>
</div>

<script src="/static/xterm.js"></script>
<script src="/static/xterm-addon-fit.js"></script>
<script>
var T={"title":"Agent Hub", "connecting":"连接中", "connected":"已连接", "disconnected":"断开", "start":"启动", "starting":"启动中...", "stop":"停止", "terminal":"终端", "monitor":"监控", "status":"状态", "uptime":"运行时长", "tools":"工具调用", "events":"事件数", "tool_stats":"工具统计", "waiting":"等待数据...", "event_log":"事件日志", "tool_prefix":"工具: ", "enter_cmd":"输入指令或语音...", "send":"发送", "voice_start":"开始监听...", "voice_stop":"已停止", "voice_err":"网络错误", "voice_not_support":"不支持语音识别，请用 Chrome", "voice_label":"[语音] ", "process_exit":"进程已退出", "idle":"空闲", "running":"运行中", "error":"错误", "no_agents":"未检测到 Agent，请先安装 CLI 工具", "split":"分屏", "fullscreen":"全屏", "agent_status_running":"运行中", "agent_status_stopped":"已停止"};
var agents=[], sessions={}, terms={}, wss={}, focusId=null, splitMode=1;
var voiceRec=null, voiceOn=false;

function switchTab(n){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.tab[data-tab="'+n+'"]').classList.add('active');
  document.getElementById('tab-'+n).classList.add('active');
  document.getElementById('mobileBar').style.display=(n==='terminal')?'flex':'none';
  if(n==='terminal') setTimeout(fitAll,100);
}

// === Load agents ===
function loadAgents(){
  fetch('/api/agents').then(function(r){return r.json()}).then(function(data){
    agents=data; renderAgentBar();
  });
}

function renderAgentBar(){
  var bar=document.getElementById('agentBar'), hint=document.getElementById('noAgentHint');
  if(!agents.length){bar.innerHTML='';hint.style.display='flex';return}
  hint.style.display='none';
  bar.innerHTML=agents.map(function(a){
    var running=sessionsForAgent(a.id).length>0;
    var cls='agent-card'+(focusId&&focusId.startsWith(a.id)?' active':'')+(running?' running':'');
    return '<div class="'+cls+'" onclick="onAgentClick(''+a.id+'')">'+
      '<div class="agent-icon" style="color:'+a.color+'">'+a.icon+'</div>'+
      '<div class="agent-name">'+a.name+'</div>'+
      '<div class="agent-status"><span class="agent-status-dot '+(running?'dot-run':'dot-idle')+'"></span>'+
      (running?T.agent_status_running:T.idle)+'</div></div>';
  }).join('');
}

function sessionsForAgent(aid){
  return Object.values(sessions).filter(function(s){return s.agent_id===aid && s.status==='running'});
}

function onAgentClick(aid){
  var running=sessionsForAgent(aid);
  if(running.length>0){
    setFocus(running[0].session_id);
  } else {
    startAgent(aid);
  }
}

function startAgent(aid){
  fetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agent_id:aid})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.status==='started'){
      sessions[d.session.session_id]=d.session;
      createTerminal(d.session);
      setFocus(d.session.session_id);
      connectWS(d.session.session_id);
      renderAgentBar();
    }
  });
}

function stopSession(sid){
  fetch('/api/sessions/'+sid,{method:'DELETE'}).then(function(){
    delete sessions[sid]; delete terms[sid]; delete wss[sid];
    renderAgentBar(); refreshLayout();
  });
}

// === Terminal ===
function createTerminal(session){
  var area=document.getElementById('terminalArea');
  var pane=document.createElement('div');
  pane.className='terminal-pane';
  pane.id='pane-'+session.session_id;
  pane.innerHTML='<div class="pane-header"><span style="color:'+session.color+'">'+session.icon+' '+session.agent_name+'</span>'+
    '<span style="font-size:9px;color:var(--text2)">'+session.session_id+'</span>'+
    '<button onclick="stopSession(\"'+session.session_id+'\")" style="background:none;border:1px solid var(--border);color:var(--red);border-radius:3px;padding:1px 6px;font-size:9px;cursor:pointer">X</button></div>'+
    '<div id="xterm-'+session.session_id+'" style="flex:1"></div>';
  area.appendChild(pane);

  var t=new Terminal({
    theme:{background:'#0d1117',foreground:'#e6edf3',cursor:session.color,selectionBackground:'#264f78',
      black:'#0d1117',red:'#f85149',green:'#3fb950',yellow:'#d29922',blue:'#58a6ff',magenta:'#bc8cff',cyan:'#39c5cf',white:'#e6edf3',
      brightBlack:'#484f58',brightRed:'#f85149',brightGreen:'#3fb950',brightYellow:'#d29922',brightBlue:'#58a6ff',brightMagenta:'#bc8cff',brightCyan:'#39c5cf',brightWhite:'#e6edf3'},
    fontFamily:'Cascadia Code,Fira Code,SF Mono,Menlo,monospace',fontSize:13,lineHeight:1.15,
    cursorBlink:true,cursorStyle:'bar',scrollback:3000,convertEol:true
  });
  var fit=new FitAddon.FitAddon();t.loadAddon(fit);
  t.open(document.getElementById('xterm-'+session.session_id));
  terms[session.session_id]={term:t,fit:fit};

  // Desktop input
  var hi=document.getElementById('hiddenInput');
  t.onData(function(d){if(wss[session.session_id]&&wss[session.session_id].readyState===1)
    wss[session.session_id].send(JSON.stringify({type:'input',data:d}))});
}

function connectWS(sid){
  var proto=location.protocol==='https:'?'wss:':'ws:';
  var ws=new WebSocket(proto+'//'+location.host+'/ws/terminal/'+sid);
  ws.onopen=function(){updateConn('ok')};
  ws.onmessage=function(ev){
    try{var m=JSON.parse(ev.data);
      if(m.type==='data'&&terms[sid])terms[sid].term.write(m.data);
      else if(m.type==='exit'&&terms[sid])terms[sid].term.write('\r\n\x1b[31m['+T.process_exit+']\x1b[0m\r\n');
    }catch(e){}
  };
  ws.onclose=function(){setTimeout(function(){connectWS(sid)},3000)};
  wss[sid]=ws;
}

function setFocus(sid){
  focusId=sid;
  refreshLayout();
  renderAgentBar();
  setTimeout(fitAll,50);
}

function refreshLayout(){
  var area=document.getElementById('terminalArea');
  area.className='terminal-area'+(splitMode>1?' split-'+splitMode:'');
  var panes=area.querySelectorAll('.terminal-pane');
  var visibleSessions=Object.keys(sessions).filter(function(k){return sessions[k].status==='running'});
  panes.forEach(function(p){p.classList.remove('visible')});

  var show=visibleSessions.slice(0,splitMode===1?1:splitMode);
  if(focusId && sessions[focusId] && sessions[focusId].status==='running'){
    show=show.filter(function(s){return s!==focusId});
    show.unshift(focusId);
    show=show.slice(0,splitMode);
  }
  show.forEach(function(sid){
    var p=document.getElementById('pane-'+sid);
    if(p)p.classList.add('visible');
  });
}

function fitAll(){Object.values(terms).forEach(function(t){try{t.fit.fit()}catch(e){}})}

function cycleSplit(){
  splitMode=splitMode===1?2:splitMode===2?4:1;
  document.getElementById('splitBtn').textContent=T.split+' '+splitMode;
  refreshLayout();setTimeout(fitAll,100);
}

// === Input ===
var hi=document.getElementById('hiddenInput');
document.getElementById('terminalWrapper');
document.getElementById('tab-terminal').addEventListener('click',function(){hi.focus()});
hi.addEventListener('input',function(e){
  var t=e.target.value;if(t&&focusId&&wss[focusId]&&wss[focusId].readyState===1){
    wss[focusId].send(JSON.stringify({type:'input',data:t}));e.target.value=''}});

function sendText(){
  var i=document.getElementById('inputText'),t=i.value;if(!t)return;
  if(focusId&&wss[focusId]&&wss[focusId].readyState===1)
    wss[focusId].send(JSON.stringify({type:'input',data:t+'\r'}));
  i.value='';hi.focus();
}
document.getElementById('inputText').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendText()}});

var km={'Escape':'\x1b','C-c':'\x03','Enter':'\r','Tab':'\t','Up':'\x1b[A','Down':'\x1b[B'};
function sendKey(k){var s=km[k];if(s&&focusId&&wss[focusId]&&wss[focusId].readyState===1)wss[focusId].send(JSON.stringify({type:'input',data:s}))}

// === Voice ===
function toggleVoice(){
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){alert(T.voice_not_support);return}
  voiceOn?stopVoice():startVoice();
}
function startVoice(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  voiceRec=new SR();voiceRec.lang='zh-CN';voiceRec.continuous=true;voiceRec.interimResults=true;
  voiceRec.onresult=function(ev){
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var t=ev.results[i][0].transcript;
      if(ev.results[i].isFinal&&t.trim())handleVoiceText(t);
    }
  };
  voiceRec.onerror=function(ev){if(ev.error!=='no-speech')stopVoice()};
  voiceRec.onend=function(){if(voiceOn)try{voiceRec.start()}catch(e){}};
  try{voiceRec.start();voiceOn=true;
    document.getElementById('voiceBtn').classList.add('voice-active');
    document.getElementById('voiceBtn').textContent='REC';
  }catch(e){}
}
function stopVoice(){
  voiceOn=false;if(voiceRec){try{voiceRec.stop()}catch(e){};voiceRec=null}
  document.getElementById('voiceBtn').classList.remove('voice-active');
  document.getElementById('voiceBtn').textContent='MIC';
}
function handleVoiceText(text){
  // First try as voice command via backend
  fetch('/api/voice/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.status==='started'&&d.session){
      sessions[d.session.session_id]=d.session;
      createTerminal(d.session);setFocus(d.session.session_id);
      connectWS(d.session.session_id);renderAgentBar();
      if(terms[d.session.session_id])terms[d.session.session_id].term.write('\x1b[90m'+T.voice_label+text+'\x1b[0m');
    } else if(d.status==='input'){
      // Plain input to focused terminal
      if(focusId&&wss[focusId]&&wss[focusId].readyState===1){
        wss[focusId].send(JSON.stringify({type:'input',data:d.text+'\r'}));
        if(terms[focusId])terms[focusId].term.write('\x1b[90m'+T.voice_label+d.text+'\x1b[0m');
      }
    } else if(d.parsed&&d.parsed.type==='command'){
      // UI commands handled by parsed result
      if(d.parsed.action==='split')cycleSplit();
    }
  });
}

// === Connection ===
function updateConn(s){
  var d=document.getElementById('connDot'),b=document.getElementById('connBadge');
  if(s==='ok'){d.className='status-dot dot-green';b.textContent=T.connected}
  else{d.className='status-dot dot-red';b.textContent=T.disconnected}
}

// === SSE ===
function connectSSE(){
  var es=new EventSource('/api/events');
  es.onmessage=function(e){try{var d=JSON.parse(e.data);addEvent(d)}catch(err){}};
  es.onerror=function(){es.close();setTimeout(connectSSE,5000)};
}
function addEvent(d){
  var list=document.getElementById('eventList');
  var type=d.event||'unknown',cls='ev-tool';
  if(type.indexOf('stop')>=0)cls='ev-stop';else if(type.indexOf('start')>=0)cls='ev-start';
  var desc=d.agent_id||d.tool||d.message||type;
  var div=document.createElement('div');div.className='event-item';
  div.innerHTML='<span class="event-time">'+(d.time_str||'--:--:--')+'</span><span class="event-type '+cls+'">'+type+'</span><span>'+desc+'</span>';
  list.insertBefore(div,list.firstChild);
  while(list.children.length>100)list.removeChild(list.lastChild);
}

// === Refresh sessions ===
function refreshSessions(){
  fetch('/api/sessions').then(function(r){return r.json()}).then(function(data){
    data.forEach(function(s){sessions[s.session_id]=s});
    renderAgentBar();refreshLayout();
  });
}

// === Init ===
loadAgents();connectSSE();refreshSessions();
setInterval(refreshSessions,5000);
setTimeout(function(){if(agents.length)document.getElementById('noAgentHint').style.display='none'},1000);
</script>
</body>
</html>
